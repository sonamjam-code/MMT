<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>專屬心情紀錄小站</title>
  <style>
    body {
      background-color: #FFFDF2;
      font-family: 'Microsoft JhengHei', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 400px;
      z-index: 10;
      margin-bottom: 20px;
    }
    h2 { color: #5D4037; text-align: center; margin-bottom: 25px; }
    
    .emoji-group { display: flex; justify-content: space-between; margin-bottom: 20px; }
    .emoji-btn {
      font-size: 28px; background: none; border: 2px solid transparent;
      border-radius: 50%; cursor: pointer; transition: 0.2s; padding: 5px;
    }
    .emoji-btn.selected { background: #FFF9C4; border: 2px solid #FFD54F; transform: scale(1.1); }
    
    textarea {
      width: 100%; height: 100px; border: 1px solid #E0E0E0; border-radius: 8px;
      padding: 12px; box-sizing: border-box; resize: none; margin-bottom: 20px; font-family: inherit;
    }
    
    button.submit-btn, button.login-btn {
      width: 100%; color: #5D4037; border: none; padding: 12px;
      border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
    }
    button.submit-btn { background: #FFCA28; }
    button.login-btn { background: #4285F4; color: white; margin-bottom: 10px; display: none; }
    button:disabled { background: #E0E0E0; cursor: not-allowed; }
    
    .user-info { text-align: center; font-size: 14px; color: #795548; margin-bottom: 15px; display: none; }
    
    #toast {
      visibility: hidden; min-width: 200px; background-color: #4CAF50; color: white;
      text-align: center; border-radius: 8px; padding: 12px; position: fixed;
      z-index: 100; bottom: 30px; opacity: 0; transition: opacity 0.3s;
    }
    #toast.show { visibility: visible; opacity: 1; }

    /* 歷史紀錄區塊 */
    .history-list { width: 100%; max-width: 400px; z-index: 10; margin-bottom: 80px; }
    .history-card {
      background: white; padding: 15px; border-radius: 10px; margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03); display: flex; align-items: center; gap: 15px;
    }
    .history-emoji { font-size: 30px; }
    .history-text { flex: 1; }
    .history-date { font-size: 12px; color: #9E9E9E; margin-bottom: 4px; }
    .history-note { font-size: 14px; color: #424242; }

    .flower { position: fixed; bottom: -10px; font-size: 40px; animation: sway 4s ease-in-out infinite alternate; z-index: 1; }
    .f1 { left: 10%; animation-delay: 0s; }
    .f2 { left: 45%; animation-delay: 1s; font-size: 30px; }
    .f3 { right: 15%; animation-delay: 0.5s; font-size: 50px; }
    @keyframes sway { 0% { transform: rotate(-10deg) translateX(-5px); } 100% { transform: rotate(10deg) translateX(5px); } }
  </style>
</head>
<body>

  <button class="login-btn" id="loginBtn">用 Google 帳號登入</button>
  <div class="user-info" id="userInfo"></div>

  <div class="container" id="appContainer" style="display: none;">
    <h2>今日心情紀錄</h2>
    <div class="emoji-group" id="emojiGroup">
      <button class="emoji-btn" onclick="selectEmoji(this, '😄')">😄</button>
      <button class="emoji-btn" onclick="selectEmoji(this, '😊')">😊</button>
      <button class="emoji-btn" onclick="selectEmoji(this, '😐')">😐</button>
      <button class="emoji-btn" onclick="selectEmoji(this, '😫')">😫</button>
      <button class="emoji-btn" onclick="selectEmoji(this, '😡')">😡</button>
      <button class="emoji-btn" onclick="selectEmoji(this, '😰')">😰</button>
    </div>
    <textarea id="note" placeholder="說給未來的自己的話..."></textarea>
    <button class="submit-btn" id="btnSubmit" onclick="submitData()">✨ 封存這份心情 ✨</button>
  </div>

  <div class="history-list" id="historyList"></div>

  <div id="toast">儲存成功！🌸</div>

  <div class="flower f1">🌸</div>
  <div class="flower f2">🌼</div>
  <div class="flower f3">🌸</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // 整合您的 Firebase 設定
    const firebaseConfig = {
      apiKey: "AIzaSyAvfo03ld9njQLK1zAvkiX9v6_Nt9-uuDQ",
      authDomain: "mood-cbd5d.firebaseapp.com",
      projectId: "mood-cbd5d",
      appId: "1:1066527272883:web:4850e8a55103d71985a5c6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let currentEmoji = '';

    const loginBtn = document.getElementById('loginBtn');
    const appContainer = document.getElementById('appContainer');
    const userInfo = document.getElementById('userInfo');
    const historyList = document.getElementById('historyList');

    // 登入邏輯
    loginBtn.addEventListener('click', () => {
      signInWithPopup(auth, provider).catch(err => alert("登入失敗：" + err.message));
    });

    // 監聽身分狀態
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        loginBtn.style.display = 'none';
        appContainer.style.display = 'block';
        userInfo.style.display = 'block';
        userInfo.innerText = `歡迎，${user.displayName} 🌸`;
        loadHistory();
      } else {
        currentUser = null;
        loginBtn.style.display = 'block';
        appContainer.style.display = 'none';
        userInfo.style.display = 'none';
        historyList.innerHTML = '';
      }
    });

    // 表情選擇
    window.selectEmoji = function(btn, emoji) {
      document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      currentEmoji = emoji;
    }

    // 提交資料至 Firestore
    window.submitData = async function() {
      if (!currentEmoji) return alert("請先選擇一個表情喔！");
      if (!currentUser) return alert("請先登入！");

      const note = document.getElementById('note').value;
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerText = "儲存中...";

      try {
        await addDoc(collection(db, `users/${currentUser.uid}/moods`), {
          emoji: currentEmoji,
          note: note,
          timestamp: serverTimestamp()
        });
        
        // 重置表單與提示
        document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'));
        currentEmoji = '';
        document.getElementById('note').value = '';
        
        const toast = document.getElementById("toast");
        toast.className = "show";
        setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
      } catch (e) {
        alert("儲存失敗：" + e.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "✨ 封存這份心情 ✨";
      }
    }

    // 即時讀取歷史紀錄
    function loadHistory() {
      const q = query(collection(db, `users/${currentUser.uid}/moods`), orderBy("timestamp", "desc"));
      onSnapshot(q, (snapshot) => {
        historyList.innerHTML = '';
        snapshot.forEach((doc) => {
          const data = doc.data();
          const dateStr = data.timestamp ? data.timestamp.toDate().toLocaleString() : '剛剛';
          
          const card = document.createElement('div');
          card.className = 'history-card';
          card.innerHTML = `
            <div class="history-emoji">${data.emoji}</div>
            <div class="history-text">
              <div class="history-date">${dateStr}</div>
              <div class="history-note">${data.note}</div>
            </div>
          `;
          historyList.appendChild(card);
        });
      });
    }
  </script>
</body>
</html>
